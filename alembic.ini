# Alembic 설정 (계약 C6 마이그레이션 규칙, 안정성 설계 6장).
# 보통은 `geosan init-db`·`geosan db merge-heads`가 이 설정을 코드로 읽어 쓴다.
# 직접 쓸 때: `alembic revision -m "<설명>" --rev-id <접두사>_<번호>` (DB 경로는 GEOSAN_DB_PATH).
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
# 파일 이름 = <rev-id>_<설명>.py  (예: rec_002_bookmark.py). rev-id는 접두사_번호로 사람이 정한다.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# sqlalchemy.url은 비워 둔다. migrations/env.py가 GEOSAN_DB_PATH에서 만든다.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
