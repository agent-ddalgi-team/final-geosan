# Alembic settings (contract C6). ASCII only: Alembic reads this file with the
# OS locale encoding, so Korean comments break on Windows (CP949). The Korean
# explanation lives in geosan/storage/migrate.py (module docstring).
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
# file name = <rev-id>_<slug>.py (e.g. rec_002_bookmark.py); rev-id = <prefix>_<number>, chosen by a person.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# sqlalchemy.url stays empty; migrations/env.py builds it from GEOSAN_DB_PATH.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
