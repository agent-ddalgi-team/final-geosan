name: 버그
description: 동작이 기대와 다를 때
title: "[버그] 어디서 무엇이 잘못된다"
labels: ["버그"]
body:
  - type: markdown
    attributes:
      value: |
        쉬운 말로 적어 주세요. **첫 줄은 결론 한 문장, 그 아래 "왜 · 흐름" 5줄**(AGENTS.md "글쓰기 규칙", 2026-11-04 PM 결정). 영역 라벨(백엔드 / 화면 / 규칙엔진 / 자료 / PM)과 마일스톤을 오른쪽에서 골라 주세요.
        화면 캡처는 연락처·거산 내부 자료가 보이지 않게 가려 주세요.
  - type: textarea
    id: why-flow
    attributes:
      label: 결론과 왜 · 흐름
      description: 첫 줄은 결론 한 문장(안 됐다 ○○). 그 아래 5줄은 고치면 보이는 변화·잘못되는 흐름·원인(이유)·안 고른 방법(권하지 않는 고치는 법)·남은 것(결정할 게 없으면 "없음").
      placeholder: |
        **결론: 안 됐다: 11/5부터 파이썬 검사가 모든 PR에서 빨간 X입니다. 코드가 아니라 날짜 때문입니다.**
        ## 왜 · 흐름
        **🎯 바뀌는 것** — 고치면 PR의 파이썬 검사가 다시 초록이 됩니다.
        **🔁 흐름** — 시험이 평가를 기준일 없이 부름 → 기준일이 "오늘" → 예시 공고 마감이 가까워져 점수가 77에서 72.
        **💡 이유** — 기준일을 날짜별로 고정해 돌려 보니 11/4까지 통과, 11/5부터 실패.
        **🚫 안 고른 방법** — 기대값을 72로 바꾸기(날짜가 바뀌면 또 깨지고 PM 확인 값 훼손).
        **📌 남은 것** — 없음
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 어디서
      description: 화면 이름, 명령 이름, API 경로 중 하나
      placeholder: "추천 목록 화면 / geosan import-case / GET /api/v1/opportunities"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 어떻게 했더니
      description: 다시 일어나게 하는 순서. 쓴 파일이 있으면 파일 이름도.
      placeholder: |
        1. examples/case-apjeong.json을 투입했다
        2. 평가를 돌렸다
        3. 목록을 열었다
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
      placeholder: "순위 1, 분류 '지금 연락', 점수 81"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 오류 문구가 있으면 그대로 붙여 주세요.
    validations:
      required: true
  - type: input
    id: folder
    attributes:
      label: 담당 폴더(짐작)
      placeholder: "geosan/rules/"
