name: 작업
description: 구현·문서·설정·자료 정리처럼 해야 할 일 하나 (1~2일 크기)
title: "[이름] 무엇을 한다"
labels: ["작업"]
body:
  - type: markdown
    attributes:
      value: |
        **첫 줄은 결론 한 문장, 그 아래 "왜 · 흐름" 5줄, 그다음 할 일·완료 기준.** 항목마다 `[어느 화면 › 어느 줄]`로 어디 얘기인지 먼저 쓰고 실제 예문 하나를 붙입니다. 기술 세부는 맨 아래 접는 칸(기술 메모)에. (AGENTS.md "글쓰기 규칙", 2026-11-04 PM 결정)
        영역 라벨(백엔드 / 화면 / 규칙엔진 / 자료 / PM)과 마일스톤을 오른쪽에서 꼭 골라 주세요.
        마일스톤이 없으면 자동 댓글이 달리고, 이 이슈에 연결한 PR은 검사에서 빨간 X가 납니다.
        **만들기 전에 같은 일의 이슈가 이미 있는지 검색**합니다. 있으면 새로 만들지 말고 그 이슈에 댓글로 이어 갑니다.
        여러 사람이 나눠 하는 일은 상위 이슈 하나를 두고, 사람마다 하위 이슈(sub-issue)를 만듭니다. PR은 하위 이슈에 연결합니다.
        연락처·비밀번호·거산 내부 자료는 적지 않습니다.
  - type: textarea
    id: why-flow
    attributes:
      label: 결론과 왜 · 흐름
      description: 첫 줄은 결론 한 문장(됐다 / 안 됐다 / 결정 필요 / 질문). 그 아래 5줄은 담당자 눈에 보이는 변화·쓰는 순서·이유(PM 결정이 있었으면 그 내용)·안 고른 방법·남은 것. 결정할 게 없으면 "없음".
      placeholder: |
        **결론: 담당자가 상세 화면에서 거래 관계를 입력하면 저장·이력·재평가를 한 번에 처리하는 서버를 만든다. 1차.**
        ## 왜 · 흐름
        **🎯 바뀌는 것** — 지금은 PM이 사례 파일을 고쳐야 거래 관계가 바뀝니다. 끝나면 담당자가 상세 화면에서 바로 넣습니다.
        **🔁 흐름** — 단추 → 서버 검사 → 저장 + 이력 1행 → 재평가 → 활동 이력 한 줄 → 화면 새로 불러오기.
        **💡 이유** — 거래 관계는 점수의 입력값이라 재평가를 같이 안 하면 카드가 거짓말을 합니다.
        **🚫 안 고른 방법** — 저장 부서가 직접 재평가 부르기(서로 불러서 꼬임) → 창구(API)가 저장 → 재평가 순서로 부름.
        **📌 남은 것** — 없음
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 무엇을 만들거나 정리하는지. 순서가 있으면 번호를 붙여 주세요.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: 완료 기준
      description: 무엇이 되면 끝났다고 볼지. 돌려야 할 명령과 기대 결과, 시나리오 번호(S01~S14)가 있으면 적어 주세요.
      placeholder: |
        - `pytest tests/unit/u1/test_rules_items.py` 통과
        - A정밀 입력으로 E 77 / P 95 / S 81.1 / R 82
    validations:
      required: true
  - type: input
    id: folder
    attributes:
      label: 담당 폴더
      description: 이 일로 고치는 폴더. 담당 폴더 밖은 고치지 않습니다.
      placeholder: "geosan/rules/, tests/unit/u1/"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: 상위 이슈
      description: 이 일이 더 큰 일의 한 조각이면 그 이슈 번호. 만든 뒤 상위 이슈의 "Sub-issues"에서 이 이슈를 연결합니다(또는 AI 도구에 "하위 이슈로 연결해 줘").
      placeholder: "#136"
  - type: input
    id: plan
    attributes:
      label: 관련 계획 문서
      description: 코드 생성 계획의 Step 번호, 작업 지시서, 기능 설계 문서 등
      placeholder: "코드 생성 계획 Step 13, docs/work-orders/u1-rules-engine.md"
  - type: input
    id: owner
    attributes:
      label: 담당(이름)
      description: GitHub 초대 전이면 이름만 적고, 초대 후 오른쪽 담당자(Assignees)로 바꿉니다.
      placeholder: "유동렬"
