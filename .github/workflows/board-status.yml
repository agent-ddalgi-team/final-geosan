# 가지·PR에 따라 이슈의 보드 칸을 자동으로 옮긴다 (AGENTS.md "GitHub 이슈·보드 규칙", 2026-10-27 PM 결정, #154).
#
#   가지를 처음 올리면(create)  → 가지 이름의 이슈 번호를 검사(scripts/check-branch-issue.sh)하고 '진행 중'으로
#   PR을 열면(opened·reopened)  → 본문 `Closes #번호` 이슈를 '리뷰 중'으로
#   PR이 합쳐지면              → 보드 자동화 "Pull request merged"·"Item closed"가 '완료'로 (PM이 보드 설정에서 켬)
#
# 보드는 조직 프로젝트라 GitHub 기본 토큰으로는 못 옮긴다. 저장소 비밀 PROJECT_TOKEN(조직 Projects 읽기·쓰기
# 권한의 fine-grained PAT)이 있으면 옮기고, 없으면 이슈 댓글로 "직접 옮겨 주세요"라고만 알린다.
name: board-status

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  branch:
    name: 가지 → 이슈 확인 → 진행 중
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: 가지 이름의 이슈 번호 검사
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.ref }}
        run: |
          set +e
          out="$(bash scripts/check-branch-issue.sh "$BRANCH")"; code=$?
          echo "$out"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          echo "issue=$(tail -n 1 <<<"$out" | grep -oE '^[0-9]+$')" >> "$GITHUB_OUTPUT"
          exit $code

      - name: 보드 '진행 중'으로 옮기고 이슈에 알림
        if: steps.check.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE: ${{ steps.check.outputs.issue }}
          BRANCH: ${{ github.event.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ -n "$PROJECT_TOKEN" ]]; then
            GH_TOKEN="$PROJECT_TOKEN" bash scripts/board-status.sh "$ISSUE" "진행 중" && moved=1 || moved=0
          else
            moved=0
          fi
          if [[ "$moved" == "1" ]]; then
            msg="**가지 올라감 (자동)** — \`$BRANCH\` 가지가 만들어져 보드 칸을 **진행 중**으로 옮겼습니다. ($ACTOR)"
          else
            msg="**가지 올라감 (자동)** — \`$BRANCH\` 가지가 만들어졌습니다. 보드 칸을 **진행 중**으로 직접 옮겨 주세요. (저장소 비밀 PROJECT_TOKEN이 있으면 자동으로 옮깁니다)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="$msg" >/dev/null

  pr:
    name: PR → Closes 이슈 리뷰 중
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Closes 이슈를 '리뷰 중'으로
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          nums="$(grep -oiE '(closes|closed|fixes|fixed|resolves|resolved) +#[0-9]+' <<<"$BODY" | grep -oE '[0-9]+' | sort -un)"
          if [[ -z "$nums" ]]; then
            echo "Closes #번호가 없어 옮길 이슈가 없습니다(pr-link 검사가 따로 알립니다)."
            exit 0
          fi
          for n in $nums; do
            if [[ -n "$PROJECT_TOKEN" ]]; then
              GH_TOKEN="$PROJECT_TOKEN" bash scripts/board-status.sh "$n" "리뷰 중" || echo "#$n 옮기지 못함"
            else
              echo "PROJECT_TOKEN 없음: #$n 은 보드 자동화 'Pull request linked to issue' 또는 사람이 '리뷰 중'으로 옮깁니다."
            fi
          done
