[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosan"
version = "0.1.0"
description = "거산케미칼 AI 영업지원 에이전트 2차 — 잠재고객 추천 (U1 뼈대)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# 런타임 의존성. HTTP 클라이언트(requests/httpx)·LLM SDK는 넣지 않는다(보안 설계 4장: 외부 호출 없음의 구조적 보장).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "typer>=0.12",
  # 홈페이지 읽기의 인증서 확인 목록. 운영체제 목록이 오래되면 새 인증 기관을 몰라 읽기가 실패한다(#556).
  "certifi>=2024.2",
  # 팩토리온 공장조회 엑셀(.xlsx) 읽기(#573).
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-bdd>=7.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
geosan = "geosan.commands.app:main"

[tool.setuptools.packages.find]
include = ["geosan*"]

# ---------- Ruff: 포매터 + 린터를 하나로 (team.md Code Style) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "migrations/versions", ".venv", "aidlc", "docs", "as-is"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer는 인자 기본값에 typer.Option()/Argument()를 쓰는 것이 공식 방식이라 B008을 명령 폴더에서만 끈다.
"geosan/commands/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["geosan"]
branch = false

[tool.coverage.report]
# 커버리지 하한 80%는 mvp 범위의 조직 기본값(org.md Testing Posture). 낮추지 않는다.
# CI와 scripts/check.sh는 `--cov=geosan --cov-fail-under=80`을 명시해 돌린다(단위 테스트 지침 2장).
fail_under = 80
show_missing = true
skip_empty = true
