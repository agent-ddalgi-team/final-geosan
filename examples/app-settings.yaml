# 앱 설정 파일 (AppSettings, 계약 C7) — 거산 영업지원 2차
#
# 담당자 목록·활성 거산 값 묶음·수집 범위·LLM 모드·브랜드·접속 보호 켜기를 둔다(NFR11.1).
# 비밀번호·API 키는 여기 적지 않는다. 환경 변수(GEOSAN_DB_PATH, U8부터 GEOSAN_PASSWORD)로만 읽는다(BR11.3).
# `password`·`apiKey`·`token` 같은 키가 있으면 check-config가 오류로 막는다.
# 형식 설명서: contracts/app-settings.schema.json. 모르는 키는 오류, `_설명` 키는 무시된다.

# 담당자 목록. key는 영문·숫자·하이픈(C0 staffKey), displayName은 화면에 보이는 이름.
# 표시 이름은 페르소나의 역할 이름 4개다(영업 담당·검수 담당·운영 담당·대표/상무 보기 전용; PM 결정 2026-10-24, 이슈 #104).
# 거산 담당자 실제 이름은 적지 않는다(CON-11). 역할별 권한 구분은 계정이 생기는 G0 이후(FR14.3)에 정하며,
# 지금은 "누가 기록했는지"만 구분한다. key는 테스트·예시 사례(case-apjeong.json)가 쓰므로 그대로 둔다.
# 예약 키 viewer(보기 전용)는 기록 요청이 거부된다(BR9.3).
staff:
  - { key: park-lee, displayName: "영업 담당" }
  - { key: kim-gwajang, displayName: "검수 담당(품질·기술)" }
  - { key: choi-pm, displayName: "운영 담당" }
  - { key: viewer, displayName: "보기 전용(대표·상무)" }

# 평가·조회가 읽는 거산 값 묶음 (FR4.14): VIRTUAL_REVIEWED(가상 검수) / BROCHURE(소개서, 검수 대기) / COMPANY_CONFIRMED(거산 확인 완료)
# 10월 말 부분 시연은 소개서 묶음으로 하므로 기본값을 BROCHURE로 둔다(기능 명세 W8, 이슈 #91).
# A정밀 가상 사례로 확인할 때는 이 값을 VIRTUAL_REVIEWED로 고친 뒤 `geosan check-config`를 다시 실행한다.
activeDatasetKind: BROCHURE

# 수집 범위 (U3에서 쓴다, FR9.1 기본값). U1은 읽기만 한다.
ingestion:
  # "충남"은 충남 전체, 시·군을 고르면 그 시·군만 AI가 판단한다(PM 결정 2026-11-09, #521).
  regions: ["충남", "천안시", "아산시", "당진시", "서산시", "공주시", "보령시", "논산시", "계룡시", "금산군", "부여군", "서천군", "청양군", "홍성군", "예산군", "태안군", "대전", "세종"]
  productKeywords: ["금속가공", "기계부품", "전자부품", "금형"]
  maxCandidates: 50
  # 누르기 전 예상 금액·잠금 계산에만 쓰는 단가(#549). 실제 한도 검사는 전송 기록으로 한다. PM이 실측을 보고 고친다.
  costEstimate:
    judgeUsdPerRow: 0.002          # 공장 1행 AI 판단(실측 1행 약 $0.0015~0.0018)
    researchUsdPerCompany: 0.04    # 회사 1곳 자동 조사(실측 117곳 평균 $0.038)
    researchCallsPerCompany: 2     # 회사 1곳 조사의 호출 수(실측 평균 1.15회)
    webSearchUsdPerBatch: 0.04     # 후보 웹 검색 1회(실측 $0.0405)
  # 기준일 YYYYMMDD가 파일명 끝 또는 바로 위 폴더에 있어야 한다. CSV는 Git에 올리지 않는다.
  factoryCsvPath: data/sources/kicox-factory-csv/20251231/한국산업단지공단_전국등록공장현황_등록공장현황자료_20251231.csv
  aiPick:
    enabled: false
    rowsPerCall: 20  # 100행은 60초 한도를 넘김(PM #491, 2026-11-09)
    promptFile: examples/prompts/candidate-pick.md
    surfaceTreatmentIndustryNames: []  # 업종명 규칙의 값은 PM이 정한 뒤 넣는다.
    surfaceTreatmentIndustryCodes: ["25922", "25923"]  # 팩토리온 업종번호: 도금업·도장 및 기타 피막처리업(PM 승인 #573). 열처리 25921·절삭가공 25924는 넣지 않는다
    model: null  # 후보 고르기만 다른 모델로(예: gpt-6-luna). 비우면 llm.model. 모델 비교용(PM #491)
    excludeKeywords: [운송, 물류, 택배, 창고업, 도매, 소매, 무역, 소프트웨어, 정보서비스, 통신서비스, 식품, 음료, 제과, 제빵, 섬유, 의류, 봉제, 출판, 광고, 교육, 컨설팅, 부동산, 건설업, 토목, 시공, 음식점, 숙박]  # 제조 낌새(제조·생산·가공·부품·제작) 없이 이 말만 있으면 AI에 안 보냄
  complexList:
    _설명: "단지 조회 연결 준비. 기본은 꺼짐, 보관 일수는 PM 결정 15일(#405, 처음 7일 #393). 실제 조회·보관 실행은 후속 연결."
    enabled: false
    cacheDays: 15
    extraNames: []

# 외부 LLM. NONE은 호출 차단, EXTERNAL은 키·모델·사용량 확인 뒤 호출한다.
llm:
  mode: NONE
  provider: OPENAI
  model: gpt-6.1-sol
  allowedModels: [gpt-6.1-sol, gpt-6-luna]
  monthlyCallLimit: 1000
  inputCostPerMillionTokens: 2.0
  outputCostPerMillionTokens: 10.0
  webSearchCostPerThousandCalls: 10.0
  monthlyCostLimitUsd: 20
  unconfirmedCallCostUsd: 0.10  # 사용량을 못 받은 호출의 추정 비용(#538).
  costAlertRatio: 0.5
  costPerThousandTokens: 0

# 대표번호 후보는 PM이 승인한 지역번호만 쓴다(#219, 2026-11-03).
mainPhone:
  allowedPrefixes: ["02", "031", "032", "033", "041", "042", "043", "044", "051", "052", "053", "054", "055", "061", "062", "063", "064"]

# 홈페이지 찾기(U2). 외부 호출을 쓰려면 위의 LLM 모드도 EXTERNAL이어야 한다.
homepageDiscovery:
  enabled: true
  termsConfirmed: false  # 이전 설정 파일과의 호환용
  minConfidence: 0.7     # 이 값보다 낮으면 담당자가 홈페이지를 확인한다.
  autoResearch: true     # 새 사례의 홈페이지와 근거를 자동으로 조사할지 정한다.
  dailyCallLimit: 200    # 하루에 허용할 홈페이지 검색 횟수. 0이면 허용하지 않는다.
  # 안쪽 페이지 읽기(#557): 첫 화면 링크 중 이름이 맞는 같은 사이트 페이지를 몇 장 더 읽어 한 번에 AI에 보낸다.
  extraPages: 3          # 첫 화면 말고 더 읽는 페이지 수. 0이면 첫 화면만 읽는다.
  extraPageHints: [회사소개, 회사 소개, 인사말, 연혁, 제품, 사업, 설비, 인증, 실적, 납품, about, company, product, business, history, facility]
  extraPageMaxChars: 6000  # 안쪽 페이지 1장에서 AI에 보내는 글자 상한.

# 브랜드. 로고·강조색은 자료가 오면 여기만 바꾼다(FR6.8). 초기값은 상세 화면 설계의 팀 제안.
# demoLabel: 띠에 함께 보이는 문구. 10/29 부분 시연 동안 "부분 시연·거산 확인 전"으로 둔다(BR10.4, PM 결정 2026-10-24).
# 시연이 끝나고 거산 확인 값이 들어오면 null로 되돌린다.
brand:
  logoUrl: null
  brandName: "거산 영업지원"
  colorPrimary: "#1F5FBF"
  demoLabel: "부분 시연·거산 확인 전"

# 영업 분석표(#608, 계약 C7). 숫자는 PM이 정한다(#229와 같은 기준, 거산 사용 뒤 재조정).
salesAnalysis:
  minSampleForRatio: 10   # 표본(접촉한 곳 수)이 이보다 적으면 비율 없이 건수와 "표본 n건"만 보인다.
  closedWindowDays: 365   # 성사·거절은 결과 기록이 이 일수 안인 것만 센다(최근 12개월).

# 접속 보호 (U8). 뼈대 기간 로컬 실행에서는 끈다. 비밀번호 자체는 환경 변수 GEOSAN_PASSWORD.
accessProtection:
  enabled: false

# 지역 묶음은 계약 C7의 PM 승인 초안. 주소에서 뽑은 시·군 선택지도 함께 보인다.
listFilters:
  regionPresets:
    - label: "충남"  # PM 결정 2026-11-09(#517): "천안 인근"은 모호해 충남 시·군 전체 묶음으로. 시·군 선택지는 자동으로 따로 보인다.
      cities: ["천안시", "아산시", "당진시", "서산시", "공주시", "보령시", "논산시", "계룡시", "금산군", "부여군", "서천군", "청양군", "홍성군", "예산군", "태안군"]

# 대시보드 산업군 막대: AI가 제안한 산업군도 세고 "AI 제안 포함"을 보인다 (계약 C7, 2026-11-03 PM 결정).
# false면 사람이 확인한 산업군만 센다.
dashboard:
  countProposedIndustries: true

# 후보 웹 검색: #314 PM 승인 2026-11-09. 실행 흐름 연결 전에는 꺼 둔다.
candidateWebSearch:
  enabled: false
  dailySearchLimit: 20
  cacheDays: 15
  blockedDomains:
    - saramin.co.kr
    - jobkorea.co.kr
    - wanted.co.kr
    - incruit.com
    - work24.go.kr
    - work.go.kr
    - jobplanet.co.kr
    - catch.co.kr
    - nicebizinfo.com
    - cretop.com
    - kreditjob.com
    - thevc.kr

# 산업군 초안: 거산 확인 뒤 설정에서 조정 (2026-11-03 PM 승인)
industries:
  - 방위산업
  - 반도체
  - 반도체 장비
  - 자동차 부품
  - 항공우주
  - 밸브·유체기기
  - 조선·해양
  - 전기·전자
  - 기계·설비
  - 건설·건축자재
  - 기타
