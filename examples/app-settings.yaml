# 앱 설정 파일 (AppSettings, 계약 C7) — 거산 영업지원 2차
#
# 담당자 목록·활성 거산 값 묶음·수집 범위·LLM 모드·브랜드·접속 보호 켜기를 둔다(NFR11.1).
# 비밀번호·API 키는 여기 적지 않는다. 환경 변수(GEOSAN_DB_PATH, U8부터 GEOSAN_PASSWORD)로만 읽는다(BR11.3).
# `password`·`apiKey`·`token` 같은 키가 있으면 check-config가 오류로 막는다.
# 형식 설명서: contracts/app-settings.schema.json. 모르는 키는 오류, `_설명` 키는 무시된다.

# 담당자 목록. key는 영문·숫자·하이픈(C0 staffKey), displayName은 화면에 보이는 이름.
# 표시 이름은 페르소나의 역할 이름 4개다(영업 담당·검수 담당·운영 담당·대표/상무 보기 전용; PM 결정 2026-10-24, 이슈 #104).
# 거산 담당자 실제 이름은 적지 않는다(CON-11). 역할별 권한 구분은 계정이 생기는 G0 이후(FR14.3)에 정하며,
# 지금은 "누가 기록했는지"만 구분한다. key는 테스트·예시 사례(case-apjeong.json)가 쓰므로 그대로 둔다.
# 예약 키 viewer(보기 전용)는 기록 요청이 거부된다(BR9.3).
staff:
  - { key: park-lee, displayName: "영업 담당" }
  - { key: kim-gwajang, displayName: "검수 담당(품질·기술)" }
  - { key: choi-pm, displayName: "운영 담당" }
  - { key: viewer, displayName: "보기 전용(대표·상무)" }

# 평가·조회가 읽는 거산 값 묶음 (FR4.14): VIRTUAL_REVIEWED(가상 검수) / BROCHURE(소개서, 검수 대기) / COMPANY_CONFIRMED(거산 확인 완료)
# 10월 말 부분 시연은 소개서 묶음으로 하므로 기본값을 BROCHURE로 둔다(기능 명세 W8, 이슈 #91).
# A정밀 가상 사례로 확인할 때는 이 값을 VIRTUAL_REVIEWED로 고친 뒤 `geosan check-config`를 다시 실행한다.
activeDatasetKind: BROCHURE

# 수집 범위 (U3에서 쓴다, FR9.1 기본값). U1은 읽기만 한다.
ingestion:
  regions: ["충남", "대전", "세종"]
  productKeywords: ["금속가공", "기계부품", "전자부품", "금형"]
  maxCandidates: 50

# 외부 LLM. NONE은 호출 차단, EXTERNAL은 키·모델·사용량 확인 뒤 호출한다.
llm:
  mode: NONE
  provider: OPENAI
  model: gpt-6.1-sol
  allowedModels: [gpt-6.1-sol, gpt-6-luna]
  monthlyCallLimit: 1000
  inputCostPerMillionTokens: 2.0
  outputCostPerMillionTokens: 10.0
  webSearchCostPerThousandCalls: 10.0
  monthlyCostLimitUsd: 20
  costAlertRatio: 0.5
  costPerThousandTokens: 0

# 홈페이지 찾기(U2). 외부 호출을 쓰려면 위의 LLM 모드도 EXTERNAL이어야 한다.
homepageDiscovery:
  enabled: true
  termsConfirmed: false  # 이전 설정 파일과의 호환용
  minConfidence: 0.7     # 이 값보다 낮으면 담당자가 홈페이지를 확인한다.
  autoResearch: true     # 새 사례의 홈페이지와 근거를 자동으로 조사할지 정한다.
  dailyCallLimit: 200    # 하루에 허용할 홈페이지 검색 횟수. 0이면 허용하지 않는다.

# 브랜드. 로고·강조색은 자료가 오면 여기만 바꾼다(FR6.8). 초기값은 상세 화면 설계의 팀 제안.
# demoLabel: 띠에 함께 보이는 문구. 10/29 부분 시연 동안 "부분 시연·거산 확인 전"으로 둔다(BR10.4, PM 결정 2026-10-24).
# 시연이 끝나고 거산 확인 값이 들어오면 null로 되돌린다.
brand:
  logoUrl: null
  brandName: "거산 영업지원"
  colorPrimary: "#1F5FBF"
  demoLabel: "부분 시연·거산 확인 전"

# 접속 보호 (U8). 뼈대 기간 로컬 실행에서는 끈다. 비밀번호 자체는 환경 변수 GEOSAN_PASSWORD.
accessProtection:
  enabled: false

# 지역 묶음은 계약 C7의 PM 승인 초안. 주소에서 뽑은 시·군 선택지도 함께 보인다.
listFilters:
  regionPresets:
    - label: "천안 인근"
      cities: ["천안시", "아산시"]

# 산업군 초안: 거산 확인 뒤 설정에서 조정 (2026-11-03 PM 승인)
industries:
  - 방위산업
  - 반도체
  - 반도체 장비
  - 자동차 부품
  - 항공우주
  - 밸브·유체기기
  - 조선·해양
  - 전기·전자
  - 기계·설비
  - 기타
