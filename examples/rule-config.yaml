# 규칙 설정 파일 (RuleConfig, 계약 C7) — 거산 영업지원 2차
#
# 모든 수치(배점·단계값·확실도·감쇠·기준점·조사 시간 상한·쉬운 말 문구)는 "기업 승인 전 가설"이다.
# 코드에는 이 숫자를 적지 않고 여기서만 읽는다(BR7.6, NFR11.1). 값을 바꾸면 version을 올리고 새 평가로 돌린다.
# 출처: 요구사항 부록 A(기획서 v0.15 부록 F.1·F.2·F.4·F.6·F.7·F.9·F.10), 기능 설계 rules.md BR4~BR6.
# 형식 설명서: contracts/rule-config.schema.json. 모르는 키는 오류, `_설명` 키는 무시된다.

version: v0.17-e
hypothesisNote: "기업 승인 전 가설"

# ---------- A.1 신규 기회 프로필 (8항목, 적합도 70 + 시점 30) ----------
# matchRateSteps: 사람이 적는 단계 이름 → 일치도 숫자. 검사기가 이름을 숫자로 바꾼다(BR2.2). 단계 밖 숫자는 오류(BR4.2).
# decay: NONE(적합도 항목, 감쇠 1) / GENERAL(일반 감쇠) / BID_EXCEPTION(공고 예외) / HIRE(일반 감쇠 + 종료·채용 완료 0)
# SIG_BID·SIG_HIRE는 뜻을 넓혔다(PM 결정 2026-11-13, #685): 공고 → "구매·외주 의향", 채용 → "관심". 코드·배점은 그대로.
#   공고(BID)·채용(HIRING) 신호는 전처럼 쓰고, 통화에서 확인한 신호(아래 callSignals)도 이 두 항목에 들어간다.
newProfileItems:
  - itemCode: NEW_PRODUCT
    label: 표면처리가 필요한 제품·부품 생산 근거
    weight: 25
    matchRateSteps: { "해당": 1.0 }
    decay: NONE
  - itemCode: NEW_MATERIAL
    label: 소재와 보유 공정 일치
    weight: 20
    matchRateSteps: { "정확히 일치": 1.0, "일부 가능": 0.5 }
    decay: NONE
  - itemCode: NEW_RECORD
    label: 유사 산업·부품 납품실적
    weight: 15
    matchRateSteps: { "동일 부품": 1.0, "동일 산업": 0.67, "인접 산업": 0.33 }
    decay: NONE
  - itemCode: NEW_PERF
    label: 처리 목적·성능 태그 일치(내식·내마모·외관·전도 등)
    weight: 10
    matchRateSteps: { "2개 이상 일치": 1.0, "1개 일치": 0.5 }
    decay: NONE
  - itemCode: SIG_EXPAND
    label: 공장 증설·신규 생산라인
    weight: 10
    matchRateSteps: { "직접 관련": 1.0, "간접 관련": 0.5 }
    decay: GENERAL
  - itemCode: SIG_ORDER
    label: 신규 수주·제품 출시·사업 확대
    weight: 8
    matchRateSteps: { "직접 관련": 1.0, "간접 관련": 0.5 }
    decay: GENERAL
  - itemCode: SIG_BID
    label: 구매·외주 의향
    weight: 7
    matchRateSteps: { "직접 관련": 1.0, "간접 관련": 0.5 }
    decay: BID_EXCEPTION
  - itemCode: SIG_HIRE
    label: 관심
    weight: 5
    matchRateSteps: { "직접 관련": 1.0, "간접 관련": 0.5 }
    decay: HIRE

# ---------- A.2 재접촉 프로필 (7항목) — U6에서 쓴다. U1은 읽기만 하고 계산하지 않는다 ----------
recontactProfileItems:
  - itemCode: RE_PROCESS
    label: 과거 거래 공정·품목과 현재 역량의 일치
    weight: 25
    matchRateSteps: { "동일 공정·동일 품목": 1.0, "동일 공정·유사 품목": 0.6, "일부 공정": 0.3 }
    decay: NONE
  - itemCode: RE_ORDER
    label: 과거 수주·샘플 승인 이력
    weight: 20
    matchRateSteps: { "반복 수주": 1.0, "1회 수주": 0.7, "샘플 승인만": 0.4, "견적·상담만": 0 }
    decay: NONE
  - itemCode: RE_REQ
    label: 과거 요구조건(품질·납기·인증) 충족
    weight: 15
    matchRateSteps: { "모두 충족": 1.0, "일부 충족": 0.5 }
    decay: NONE
  - itemCode: RE_LOSS
    label: 실주·거래중단 사유의 해소
    weight: 10
    matchRateSteps: { "사유 없음 또는 해소 확인": 1.0, "미해소": 0 }
    decay: NONE
  - itemCode: RE_CYCLE
    label: 예상 재발주 시점 도래 (일치도는 recontactDates.reorderCycle의 날짜 경계로 정함)
    weight: 10
    matchRateSteps: { "해당": 1.0 }
    decay: NONE
  - itemCode: RE_SIGNAL
    label: 신규 수주·증설·관련 채용 신호
    weight: 10
    matchRateSteps: { "직접 관련": 1.0, "간접 관련": 0.5 }
    decay: GENERAL
  - itemCode: RE_NEXT
    label: 후속 연락 약속·샘플 일정·보류 해제 (일치도는 recontactDates.nextContact의 날짜 경계로 정함)
    weight: 10
    matchRateSteps: { "해당": 1.0 }
    decay: NONE

# ---------- A.3 공통 계수 ----------
# 확실도: 확인 1.0 / 강한 추정 0.65 / 약한 추정 0.25 (등급 기준 BR4.3)
certainty:
  CONFIRMED: 1.0
  STRONG: 0.65
  WEAK: 0.25

# 일반 시점 감쇠: 실제 발생일 기준 0~30일 1.0 / 31~90일 0.5 / 91일 이상 0 (BR4.4). maxDays가 null이면 "그 이상 전부".
generalDecay:
  - { maxDays: 30, factor: 1.0 }
  - { maxDays: 90, factor: 0.5 }
  - { maxDays: null, factor: 0 }

# 재접촉 날짜 경계 (A.2, U6에서 쓴다)
recontactDates:
  # 예상 재발주 시점과 기준일의 절대 차이: 0~60일 1.0 / 61~120일 0.5 / 121일 이상 0
  reorderCycle:
    - { maxAbsDays: 60, factor: 1.0 }
    - { maxAbsDays: 120, factor: 0.5 }
    - { maxAbsDays: null, factor: 0 }
  # 후속 일정: 0~30일 이내 예정 또는 1~30일 경과 1.0 / 31~90일 이내 예정 0.5 / 그 외 0 (완료·취소 0, 30일 넘긴 약속 0)
  nextContact:
    - { scheduledWithinDays: 30, pastWithinDays: 30, factor: 1.0 }
    - { scheduledWithinDays: 90, pastWithinDays: null, factor: 0.5 }
    - { scheduledWithinDays: null, pastWithinDays: null, factor: 0 }

# 분류 기준점 (BR6.1). 비교는 반올림 전 E·P·R 정수값.
thresholds:
  urgentE: 75
  plannedE: 75
  reviewE: 60
  reviewP: 70
  researchR: 60
  watchRMin: 40

# 반올림: 항목 점수는 소수 첫째 자리에서 반올림한 정수(0.5 올림), S·C는 소수 첫째 자리 표시 (BR4.1, BR4.6)
rounding:
  itemScore: HALF_UP_INT
  display: ONE_DECIMAL

# 핵심 근거 (BR5.1): 신규는 NEW_PRODUCT·NEW_MATERIAL이 각각 확인 또는 강한 추정이고, 대조한 거산 값이 검수 완료
coreEvidence:
  new:
    items: [NEW_PRODUCT, NEW_MATERIAL]
    allowedStates: [CONFIRMED, STRONG]
    requireReviewedCapability: true
  recontact:
    _설명: "U6에서 확정. 과거 이력 확인 + 현재 품목·사유 확인/강한 추정 + 거산 역량 검수 완료 (FR4.6)"
    items: [RE_PROCESS, RE_ORDER]
    allowedStates: [CONFIRMED, STRONG]
    requireReviewedCapability: true

# 시점 우선 요건 ② (BR5.3): 합의값(agreedWindow)이 있어야 충족. 임의의 "7일 이내" 같은 날짜 기준을 코드에 넣지 않는다.
timingRequirements:
  agreedWindowRequired: true

# 조사 요건 (BR5.7): 조사 시간 상한 기본값 2시간 — 팀 제안 가설, G0에서 합의한 값으로 바꾼다
researchRequirements:
  maxHoursDefault: 2

# 11분기 코드 ↔ 쉬운 말 (BR6.3). 팀 제안 초기값이며 여기서만 바꾼다. 화면은 /config/ui로 이 표를 받는다.
classificationLabels:
  FILTER_EXCLUDED: "대상 아님(제외)"
  FILTER_PENDING: "필수조건 확인 필요"
  OPS_PENDING: "거산 역량 확인 필요"
  NOT_EVALUATED: "평가 전"
  CONTACT_URGENT: "지금 바로 연락 검토"
  CONTACT_PLANNED: "계획해서 연락 검토"
  CONTACT_REVIEW: "확인 후 연락 검토"
  RESEARCH: "추가 조사 필요"
  CONDITIONAL_WAIT: "조건 충족 후 재검토"
  WATCH: "동향 모니터링"
  LOW: "검토 우선순위 낮음"

# 접촉 후보가 아닌 분류(OTHER 그룹)의 정렬 (BR6.5, 가설·설정값, 기능 설계 Q6).
# default(가상 검수·거산 확인 완료 묶음)와 brochure(소개서 묶음) 모두: E 내림 → P(판정한 배점) 내림 → 기회 ID.
#   2026-10-25 PM 결정(#63 원칙 2): 동점이면 더 많이 확인한 회사를 앞에 둔다. 가능 점수 R은 정렬에 쓰지 않는다
#   (R을 쓰면 빈칸을 끝까지 "없음"으로 판정한 회사가 R이 낮아져 뒤로 밀린다). default의 옛 R 먼저 정렬은
#   "조사 우선순위" 용도였고, 그 역할은 11월 세 묶음 안의 ②가 맡는다.
otherGroupSort:
  default:
    - { key: E, order: desc }
    - { key: P, order: desc }
    - { key: oppId, order: asc }
  brochure:
    - { key: E, order: desc }
    - { key: P, order: desc }
    - { key: oppId, order: asc }

# 기존 거래처 배치 (BR6.5, PM 승인 2026-11-04 #262). 점수·분류 계산은 그대로다.
# BOTTOM: 그룹 정렬 뒤 거래 중 기회만 맨 아래로, 각각의 기존 순서는 유지. INLINE: 원래 정렬.
existingCustomerPlacement: BOTTOM

# 거래 관계 확인 (PM 결정 2026-11-11, #567). 신규 잠재고객만 찾으므로 거래 관계 확인은 기획에서 보류.
# IGNORE: 거래 관계 "확인 전"을 필수조건 대기·막는 조건으로 쓰지 않는다. BLOCK: 기획서 S06 동작(확인 전이면 대기).
relationCheck: IGNORE

# 통화에서 확인한 신호 (PM 결정 2026-11-13, #685). 담당자가 통화 뒤 고른 꼬리 질문 답이 시점 점수로 들어간다.
# questionId·answerId는 꼬리 질문 파일(examples/sales-questions.yaml)의 id다. relation: DIRECT = 확인·직접 관련(배점 전부),
# INDIRECT = 확인·간접 관련(절반). 감쇠는 통화 날짜 기준 위 generalDecay 그대로(30일까지 전부 / 90일까지 절반 / 그 뒤 0).
# 여기 없는 답("아직 없음"·"지금은 없음"·"관심 낮음/없음"·"모름"·무응답)은 신호를 만들지 않는다 = 아직 모름(0점 확정 아님).
# 같은 질문에 여러 번 답했으면 가장 최근 접촉의 답, 한 항목에 맞는 답이 여럿이면 가장 센 것 하나(직접 > 간접).
# 통화 신호는 점수에만 쓰고 "지금 바로 연락" 조건과 카드 유효 기한에는 쓰지 않는다. 사례 파일의 공고 점수가 있으면 그것이 우선.
callSignals:
  - itemCode: SIG_BID
    signalKind: CALL_INTENT
    answers:
      - { questionId: QUOTE_REQUEST, answerId: QUOTE, relation: DIRECT }      # 견적 요청
      - { questionId: SWITCH_INTENT, answerId: "YES", relation: DIRECT }      # 외주처를 바꿀 생각 있음
      - { questionId: QUOTE_REQUEST, answerId: MATERIAL, relation: INDIRECT } # 자료 요청
  - itemCode: SIG_HIRE
    signalKind: CALL_INTEREST
    answers:
      - { questionId: VISIT_OR_SAMPLE, answerId: VISIT, relation: DIRECT }    # 방문 요청
      - { questionId: VISIT_OR_SAMPLE, answerId: SAMPLE, relation: DIRECT }   # 샘플 요청
      - { questionId: INTEREST, answerId: HIGH, relation: DIRECT }            # 관심 높음
      - { questionId: INTEREST, answerId: MEDIUM, relation: INDIRECT }        # 관심 보통

# 거산 값 묶음 종류 (FR4.14)
datasetKinds: [VIRTUAL_REVIEWED, BROCHURE, COMPANY_CONFIRMED]
