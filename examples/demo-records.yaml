          - { questionId: REPLY, answerId: CAME }
          - { questionId: NEXT_ACTION, answerId: END }
          - { questionId: CLOSE_RESULT, answerId: LOST }
          - { questionId: LOST_REASON, answerId: PRICE }
  - caseId: demo-e-machining   # E기공(가상) · 아연도금 · 거절(납기)
    contacts:
      - daysAgo: 28
        method: CALL
        result: REACHED
        memo: "(가상) 체결 부품 도금은 외주. 납기가 맞으면 검토하겠다고 함"
        answers:
          - { questionId: WHO_TALKED, answerId: RIGHT_PERSON }
          - { questionId: PLATING_NOW, answerId: OUTSOURCED }
          - { questionId: INTEREST, answerId: LOW }
          - { questionId: INTEREST_DRIVER, answerId: LEAD_TIME }
          - { questionId: NEXT_ACTION, answerId: RECONTACT }
      - daysAgo: 9
        method: CALL
        result: REACHED
        memo: "(가상) 납기 조건을 다시 물어 옴"
        reason: "(가상) 요구한 납기가 짧아 맞추기 어렵다고 서로 확인"
        answers:
          - { questionId: SWITCH_INTENT, answerId: NOT_NOW }
          - { questionId: NEXT_ACTION, answerId: END }
          - { questionId: CLOSE_RESULT, answerId: LOST }
          - { questionId: LOST_REASON, answerId: LEAD_TIME }
  - caseId: demo-f-valve   # F밸브(가상) · 부동태 · 거절(기존 거래처 유지)
    contacts:
      - daysAgo: 20
        method: EMAIL
        result: ABSENT
        memo: "(가상) 소개 메일을 보냈으나 답 없음"
      - daysAgo: 12
        method: CALL
        result: DECLINED
        memo: "(가상) 통화는 됐으나 제안을 거절"
        reason: "(가상) 오래 거래한 외주처가 있어 바꿀 계획이 없다고 함"
        answers:
          - { questionId: NEXT_ACTION, answerId: END }
          - { questionId: CLOSE_RESULT, answerId: LOST }
          - { questionId: LOST_REASON, answerId: INCUMBENT_SUPPLIER }
