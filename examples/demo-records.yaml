        result: REACHED
        memo: "(가상) 방열판 아노다이징 견적을 받아 보고 싶다고 함"
        answers:
          - { questionId: WHO_TALKED, answerId: RIGHT_PERSON }
          - { questionId: PLATING_NOW, answerId: OUTSOURCED }
          - { questionId: INTEREST, answerId: MEDIUM }
          - { questionId: INTEREST_DRIVER, answerId: PRICE }
          - { questionId: QUOTE_REQUEST, answerId: QUOTE }
          - { questionId: NEXT_ACTION, answerId: QUOTE }
      - daysAgo: 15
        method: EMAIL
        result: REACHED
        memo: "(가상) 견적 검토 결과를 메일로 받음"
        reason: "(가상) 지금 외주 단가보다 높아 이번에는 진행하지 않겠다는 답"
        answers:
